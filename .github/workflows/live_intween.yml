name: 24/7 Live Stream - in.tween

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger_intween]
  schedule:
    - cron: '0 */5 * * *'  # Safety recurring backup trigger every 5 hours

concurrency:
  group: stream_intween
  cancel-in-progress: false

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download / Prepare Media
        run: |
          # If video is stored via URL / GitHub Release asset, download here:
          # e.g., curl -L -o media/stream_video.mp4 "https://..."
          echo "Media ready"

      - name: Run 24/7 Live Stream Engine
        env:
          STREAM_KEY: ${{ secrets.STREAM_KEY_INTWEEN }}
          GH_PAT_TOKEN: ${{ secrets.GH_PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python scripts/stream_engine.py \
            --stream-key "$STREAM_KEY" \
            --video "media/cover_intween.jpg" \
            --audio "media/audio_intween.m4a" \
            --duration 320 \
            --workflow-file "live_intween.yml"
